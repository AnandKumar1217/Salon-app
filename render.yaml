services:
  - type: web
    name: glamora-backend-api
    runtime: node
    rootDir: admin-web
    buildCommand: npm ci && npm run build
    startCommand: npx next start -p $PORT
    healthCheckPath: /api/health
    region: singapore
    plan: starter
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NEXT_PUBLIC_USE_MOCK_FALLBACK
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "https://salon-app-n7l2.onrender.com,https://glamora-customer-web.onrender.com,https://glamora.com,https://book.glamora.com"

  - type: static
    name: glamora-customer-web
    rootDir: Galmora/public-web
    buildCommand: ""
    publishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
